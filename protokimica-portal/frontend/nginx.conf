# Qué se cachea y qué no, en una frase: **lo que lleva hash en el nombre se
# guarda para siempre; lo demás se revalida siempre.**
#
# Esto no es una afinación: es el arreglo de un problema real. `index.html`
# es el ÚNICO archivo cuyo nombre no cambia entre versiones, y es el que dice
# qué bundle cargar. Se servía sin ninguna cabecera de caché, y un navegador
# sin instrucciones no pregunta: aplica su heurística —guarda la respuesta
# una fracción del tiempo que el archivo lleva sin cambiar, que en un archivo
# copiado dentro de una imagen son días— y sigue pidiendo el JS de la versión
# anterior contra un backend que ya cambió. De ahí los «no me funcionan los
# filtros», «no me cambia el mes» y «no conecta con Outlook» que solo se
# arreglaban borrando la caché del navegador a mano.
#
# Con `no-store` en el HTML, cada visita pregunta por el index; el JS y el
# CSS siguen guardados un año, que para eso Vite les pone el hash.

# Si el backend ya decidió cómo se cachea una respuesta suya —los QR, que son
# públicos y valen un día— se respeta lo que dijo. Al resto de la API se le
# pone `no-store`: un filtro o un mes que se quedó pegado es indistinguible
# de un dato que no se actualizó, y se diagnostica igual de mal.
# Un valor vacío hace que nginx NO agregue la cabecera.
map $upstream_http_cache_control $cache_de_la_api {
    ''      "no-store";
    default "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Límite de subida — coincide con el máximo de 20MB para videos
    # que ya tiene el backend (ver router_public.py / router.py)
    client_max_body_size 25M;

    # ── API ──────────────────────────────────────────────
    # El frontend llama a /api/... (ver frontend/src/core/api.js);
    # aquí se le quita el prefijo /api y se manda al backend.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control $cache_de_la_api always;
    }

    # ── Archivos adjuntos (fotos/facturas/videos de PQRS) ──
    # Un adjunto no cambia de contenido: quitarlo lo desvincula, no lo
    # reescribe (ver «PQRS — corregir datos y adjuntos»). Así que se puede
    # guardar, y una PQRS con foto y video deja de descargarlos cada vez.
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;

        add_header Cache-Control "private, max-age=86400" always;
    }

    # ── El index nunca se guarda ─────────────────────────
    # Va antes que `location /` por ser coincidencia exacta, y también lo
    # alcanza el `try_files` de abajo: una ruta como /pqrs/5 hace una
    # redirección interna a /index.html que vuelve a pasar por aquí.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── Frontend (SPA) ──────────────────────────────────
    # Cualquier ruta que no sea /api ni /uploads cae aquí. Si el archivo
    # no existe físicamente, se sirve index.html y React Router decide
    # qué mostrar (necesario para que /pqrs/5, /admin, etc. funcionen
    # al refrescar la página o entrar directo por URL).
    location / {
        try_files $uri $uri/ /index.html;

        # Nada de lo que se sirve aquí lleva hash en el nombre (logo.png y
        # compañía), así que se pregunta siempre. Son unos pocos KB y, si no
        # cambió, la respuesta es un 304 que no descarga nada. Cambiar el
        # logo y que a media empresa le siga saliendo el viejo es el mismo
        # problema de antes con otra cara.
        add_header Cache-Control "no-cache" always;
    }

    # Cachear agresivamente los assets con hash en el nombre (JS/CSS de Vite):
    # su nombre cambia cuando cambia el contenido, así que guardarlos un año
    # no deja a nadie con una versión vieja.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
