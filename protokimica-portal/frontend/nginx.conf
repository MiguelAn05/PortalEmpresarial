server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Límite de subida — coincide con el máximo de 20MB para videos
    # que ya tiene el backend (ver router_public.py / router.py)
    client_max_body_size 25M;

    # ── API ──────────────────────────────────────────────
    # El frontend llama a /api/... (ver frontend/src/core/api.js);
    # aquí se le quita el prefijo /api y se manda al backend.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Archivos adjuntos (fotos/facturas/videos de PQRS) ──
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
    }

    # ── Frontend (SPA) ──────────────────────────────────
    # Cualquier ruta que no sea /api ni /uploads cae aquí. Si el archivo
    # no existe físicamente, se sirve index.html y React Router decide
    # qué mostrar (necesario para que /pqrs/5, /admin, etc. funcionen
    # al refrescar la página o entrar directo por URL).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cachear agresivamente los assets con hash en el nombre (JS/CSS de Vite)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
