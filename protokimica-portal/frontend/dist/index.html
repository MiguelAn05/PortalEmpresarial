<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Empresarial</title>

    <!--
      La pantalla de arranque va AQUÍ y no dentro de React, a propósito.

      El bundle pesa ~850 KB: entre que el navegador recibe este HTML y React
      monta pasa un rato real, y hasta ahora eso era una pantalla en blanco —
      que es lo que la gente lee como «el portal no abre». Un arranque escrito
      en React solo aparecería DESPUÉS de que todo cargó, es decir, cuando ya
      no hace falta.

      Por eso los estilos van en línea y no en index.css: el CSS también se
      descarga, y esto tiene que estar pintado en el primer frame. Es la única
      excepción a la regla de que los colores viven en index.css; van copiados
      de sus tokens (`--color-fondo`, `--color-acento`, `--color-superficie-2`)
      y no hay un tercer sitio donde se repitan.
    -->
    <style>
      #arranque {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #F3F6FB;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity .34s cubic-bezier(.2,.7,.3,1), visibility .34s;
      }
      /* Al montar React se le pone este atributo: se desvanece en vez de
         desaparecer de golpe, que se percibe como un parpadeo. */
      #arranque[data-listo] { opacity: 0; visibility: hidden; }

      #arranque .caja { display: flex; flex-direction: column; align-items: center; gap: 20px; }
      #arranque .logo { width: 76px; height: 76px; perspective: 420px; }
      #arranque .logo img {
        width: 100%; height: 100%; object-fit: contain;
        transform-style: preserve-3d;
        animation: arranque-giro 1.9s cubic-bezier(.55,.05,.25,1) infinite;
        filter: drop-shadow(0 8px 18px rgba(13,43,94,.16));
      }
      /* El giro ocupa el 55% del ciclo y el resto queda quieto: sin esa
         pausa parece un ventilador, que se lee como algo colgado. */
      @keyframes arranque-giro { 0% { transform: rotateY(0); } 55%, 100% { transform: rotateY(360deg); } }

      #arranque .barra { width: 170px; height: 3px; border-radius: 99px; background: #EFF3F9; overflow: hidden; }
      #arranque .barra i {
        display: block; height: 100%; width: 38%; border-radius: 99px; background: #1A4FA0;
        animation: arranque-desliza 1.35s cubic-bezier(.2,.7,.3,1) infinite;
      }
      @keyframes arranque-desliza {
        0% { transform: translateX(-110%); } 100% { transform: translateX(370%); }
      }
      #arranque p { font-size: 13px; color: #8A93A9; margin: 0; }

      @media (prefers-reduced-motion: reduce) {
        #arranque .logo img { animation: none; }
        #arranque .barra i { animation: none; width: 100%; }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CnRmtX97.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CYWgdkPw.css">
  </head>
  <body>
    <div id="arranque">
      <div class="caja">
        <div class="logo"><img src="/logo.png" alt="" /></div>
        <div class="barra"><i></i></div>
        <p>Cargando el portal…</p>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
