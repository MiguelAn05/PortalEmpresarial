# Docker Compose de PRODUCCIÓN — servidor Ubuntu (zeus)
#
# Diferencias clave contra el docker-compose.yml de desarrollo:
#   - db/redis/backend NO publican puertos al host.
#   - backend usa la imagen ya compilada.
#   - cloudflared publica el portal sin abrir puertos en el servidor.
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: protokimica_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: protokimica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: protokimica_portal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protokimica -d protokimica_portal"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: protokimica_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: protokimica_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: protokimica_frontend
    restart: unless-stopped
    # Puerta directa por la red interna, para entrar por la VPN sin pasar por
    # Cloudflare: http://<ip-de-zeus>:8080
    #
    # Sin esto el portal SOLO se alcanza por el túnel, incluso estando dentro
    # de la red — no hay nada escuchando en el servidor. Por eso la VPN sola
    # no bastaba.
    #
    # Es seguro porque zeus es una VM interna sin cara a internet. Si algún
    # día se le pone una IP pública, hay que restringirlo a la interfaz
    # interna ("192.168.x.x:8080:80") o cerrarlo por firewall.
    ports:
      - "8080:80"
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:latest
    container_name: protokimica_n8n
    restart: unless-stopped
    ports:
      - "5679:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
    volumes:
      - n8n_data:/home/node/.n8n

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: protokimica_cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend

volumes:
  pgdata:
  n8n_data:
  uploads_data: